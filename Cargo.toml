[package]
name = "cli-agents"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Build agentic apps over users' existing AI subscriptions (Claude, Codex, Antigravity)"
license = "MIT"
readme = "README.md"
keywords = ["ai", "cli", "claude", "codex", "antigravity"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Suresh Koppisetty"]
repository = "https://github.com/skoppisetty/cli-agents-rs"
homepage = "https://github.com/skoppisetty/cli-agents-rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "process", "io-util", "sync", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio-util = "0.7"
tempfile = "3"
clap = { version = "4", features = ["derive"], optional = true }
toml = "1.1"

# Cross-platform binary discovery. Replaces a `Command::new("which")`
# shell-out that does not exist on Windows — and, more importantly, applies
# PATHEXT there, so an npm-installed `claude` resolves to `claude.cmd` rather
# than the extensionless bash shim npm also writes, which Windows cannot run.
which = "8"

# Home directory, resolved per-platform. `std::env::var("HOME")` is empty on
# Windows, where the variable is USERPROFILE. This is the crate cargo itself
# uses.
home = "0.5"
# `creation-flags` is a default feature of process-wrap and is what lets the
# `CreationFlags` wrapper (adapters/mod.rs) survive the JobObject wrapper.
# Named explicitly so a future default change cannot silently drop it.
process-wrap = { version = "8.2.1", features = ["tokio1", "creation-flags"] }

# NO `libc`. The only thing it was used for was `setpgid`/`killpg` in
# `adapters/mod.rs`, which `process-wrap` now does on both platforms.

# CREATE_NO_WINDOW comes from here, Windows-only. Pinned to the same `windows`
# version process-wrap already compiles (0.61) so it is one crate, not two.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Threading"] }

[features]
default = []
cli = ["clap", "tokio/signal"]

[[bin]]
name = "cli-agents"
required-features = ["cli"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
